#-------------------------------------------------------------------------------
# modified for SAULink9_ATPI v3.0 03/2026 with more audio and mic power, marked serial with X
#-------------------------------------------------------------------------------

# USB vendor and product ID configuration.
# Changing the VID/PID will cause things to break, hence readout of these values
# requires the "--enable-usb-ids 1" parameter to be set on read_yaml().
usb:
  vid: 0x0d8c
  pid: 0x0012

# Serial "number" (string). Setting this field will automatically set the "use_-
# serial_num" magic flag.
serial: "260108_010X"

# Manufacturer name. Setting this field will automatically set the "use_manuf_-
# name" magic flag.
manufacturer: "OE9SAU"

# Product name. Setting this field will automatically set the "use_product_name"
# magic flag
product: "SAULINK9_ATPI v3.0"

# Volume presets for ADC and DAC stages, in EEPROM notation (see CM108AH data-
# sheet for valid range).
presets:
  adc: 0x02   # initial ADC volume 
  dac: 0x02   # initial DAC volume

# Configuration bits. 
# Setting this field will automatically set the "cfg_bits_-valid" magic flag. 
# Commented-out values will retain default configuration. See the CM108AH data-
# sheet for details on specific configuration bits.
# Changing the "HID_EN" bit can brick the device, hence readout will require the
# "--enable-hid-bit 1" parameter to be set in read_yaml().
config:
  SHDN_DAC: false          # DAC analog circuits active
  TOTAL_PWR_CTL: false     # Total power control 
  MIC_HP: true             # MIC High Pass Filter 
  ADC_SYNC: false          # ADC sync 
  MIC_BOOST: true          # MIC Boost 
  DAC_OUT_HP: true         # Output terminal = speaker
  HID_EN: true             # HID interface MUST BE TRUE // ALWAYS
  REMOTE_WKUP_EN: false    # Remote wakeup disabled
  DAC_MAXMIN_VALID: true   # Enable DAC max/min volume
  ADC_MAXMIN_VALID: false  # Enable ADC max/min volume
  AA_MAXMIN_VALID: true    # Enable AA max/min volume